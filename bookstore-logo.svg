<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="10" fill="#1a1a1a"/>
  
  <!-- Book Stack -->
  <rect x="25" y="55" width="50" height="8" rx="2" fill="#f5f5f5"/>
  <rect x="22" y="45" width="56" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="28" y="35" width="44" height="8" rx="2" fill="#f5f5f5"/>
  
  <!-- Book Pages -->
  <line x1="35" y1="48" x2="65" y2="48" stroke="#999" stroke-width="1"/>
  <line x1="35" y1="38" x2="65" y2="38" stroke="#999" stroke-width="1"/>
  <line x1="35" y1="58" x2="65" y2="58" stroke="#999" stroke-width="1"/>
  
  <!-- Bookmark -->
  <polygon points="45,35 50,25 55,35" fill="#5a5a5a"/>
  
  <!-- Text "B" -->
  <text x="50" y="82" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#1a1a1a">B</text>
</svg>
